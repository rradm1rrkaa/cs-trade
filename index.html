<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS.Trade</title>
    <meta
      name="description"
      content="CS.Trade — современная платформа для покупки и продажи скинов Counter-Strike 2."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a href="index.html" class="brand" aria-label="CS.Trade home">
            <span class="brand-mark">C</span>
            <span class="brand-text">CS.Trade</span>
          </a>

          <nav class="main-nav" aria-label="Главное меню">
            <a href="#home" class="nav-link active">Главная</a>
            <a href="#catalog" class="nav-link">Покупка</a>
            <a href="#sale" class="nav-link">Продажа</a>
          </nav>

          <div class="header-actions">
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Сменить тему">
              <span class="theme-icon">☀</span>
              <span class="theme-label">Светлая тема</span>
            </button>

            <button id="cartToggle" class="cart-button" type="button" aria-label="Корзина">
              <span class="cart-button__icon">🛒</span>
              <span class="cart-button__label">Корзина</span>
              <span id="cartCount" class="cart-count">0</span>
            </button>
          </div>
        </div>
      </header>

      <main id="home">
        <section class="hero">
          <div class="container hero-inner">
            <div class="hero-copy">
              <span class="eyebrow">Counter-Strike 2 marketplace</span>
              <h1>Добро пожаловать на CS.Trade</h1>
              <p>Покупайте и продавайте уникальные скины Counter-Strike 2</p>
              <div class="hero-actions">
                <a href="#catalog" class="primary-btn">ПОКУПКА</a>
                <a href="#sale" class="secondary-btn">ПРОДАЖА</a>
              </div>
            </div>

            <div class="hero-visual" aria-hidden="true">
              <div class="hud-panel">
                <div class="hud-line"></div>
                <div class="weapon-card">
                  <div class="gun-glow"></div>
                  <div class="gun-body"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="catalog" class="catalog-section">
          <div class="container">
            <div class="section-heading">
              <div>
                <span class="eyebrow">Каталог</span>
                <h2>Покупка скинов</h2>
              </div>
            </div>

            <div class="catalog-toolbar">
              <label class="search-field">
                <span>Поиск</span>
                <input id="searchInput" type="search" placeholder="AK-47, AWP, Glock, Knife..." />
              </label>

              <label class="filter-field">
                <span>Редкость</span>
                <select id="rarityFilter">
                  <option value="Все">Все</option>
                  <option value="Ширпотреб">Ширпотреб</option>
                  <option value="Промышленное качество">Промышленное качество</option>
                  <option value="Армейское качество">Армейское качество</option>
                  <option value="Запрещённое">Запрещённое</option>
                  <option value="Засекреченное">Засекреченное</option>
                  <option value="Тайное">Тайное</option>
                  <option value="Редкое спецпредложение">Редкое спецпредложение</option>
                </select>
              </label>

              <label class="filter-field">
                <span>Состояние</span>
                <select id="wearFilter">
                  <option value="Все">Все</option>
                  <option value="Factory New">Factory New</option>
                  <option value="Minimal Wear">Minimal Wear</option>
                  <option value="Field-Tested">Field-Tested</option>
                  <option value="Well-Worn">Well-Worn</option>
                  <option value="Battle-Scarred">Battle-Scarred</option>
                </select>
              </label>

              <label class="filter-field">
                <span>Сортировка</span>
                <select id="sortSelect">
                  <option value="featured">По умолчанию</option>
                  <option value="price-asc">По цене: сначала дешёвые</option>
                  <option value="price-desc">По цене: сначала дорогие</option>
                  <option value="name">По названию</option>
                  <option value="float-desc">По Float</option>
                </select>
              </label>
            </div>

            <div id="productGrid" class="product-grid" aria-live="polite"></div>
          </div>
        </section>

        <section id="sale" class="sale-section">
          <div class="container sale-wrap">
            <div class="section-heading">
              <div>
                <span class="eyebrow">Продажа</span>
                <h2>Выставить скин на продажу</h2>
              </div>
            </div>

            <form id="saleForm" class="sale-form">
              <div class="form-grid">
                <label>
                  <span>Название скина</span>
                  <input type="text" id="saleName" name="saleName" placeholder="AK-47 | Neon Rider" required />
                </label>

                <label>
                  <span>Оружие</span>
                  <input type="text" id="saleWeapon" name="saleWeapon" placeholder="AK-47" required />
                </label>

                <label>
                  <span>Цена</span>
                  <input type="number" id="salePrice" name="salePrice" min="1" step="1" placeholder="25000" required />
                </label>

                <label>
                  <span>Float Value</span>
                  <input type="number" id="saleFloat" name="saleFloat" min="0" max="1" step="0.01" placeholder="0.08" required />
                </label>

                <label>
                  <span>Pattern / Seed</span>
                  <input type="number" id="saleSeed" name="saleSeed" min="1" max="1000" placeholder="661" required />
                </label>

                <label>
                  <span>Редкость</span>
                  <select id="saleRarity" name="saleRarity">
                    <option value="Ширпотреб">Ширпотреб</option>
                    <option value="Промышленное качество">Промышленное качество</option>
                    <option value="Армейское качество">Армейское качество</option>
                    <option value="Запрещённое">Запрещённое</option>
                    <option value="Засекреченное">Засекреченное</option>
                    <option value="Тайное">Тайное</option>
                    <option value="Редкое спецпредложение">Редкое спецпредложение</option>
                  </select>
                </label>

                <label class="checkbox-row">
                  <input type="checkbox" id="saleStatTrak" name="saleStatTrak" />
                  <span>StatTrak™</span>
                </label>

                <label class="file-field">
                  <span>Изображение</span>
                  <input type="file" id="saleImage" name="saleImage" accept="image/*" />
                </label>
              </div>

              <label class="description-field">
                <span>Описание</span>
                <textarea id="saleDescription" name="saleDescription" rows="5" placeholder="Опишите состояние, особенности и историю скина" required></textarea>
              </label>

              <div class="sale-preview" id="salePreviewWrap" hidden>
                <img id="salePreview" src="" alt="Предпросмотр изображения скина" />
              </div>

              <button type="submit" class="primary-btn sale-submit">Выставить на продажу</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <aside id="cartDrawer" class="cart-drawer" aria-label="Корзина">
      <div class="cart-header">
        <h3>Корзина</h3>
        <button id="closeCart" class="close-cart" type="button" aria-label="Закрыть корзину">×</button>
      </div>
      <div id="cartItems" class="cart-items" aria-live="polite"></div>
      <div class="cart-summary">
        <div class="total-line">
          <span>Итого:</span>
          <strong id="cartTotal">0 ₸</strong>
        </div>
        <a id="checkoutLink" href="checkout.html" class="checkout-btn disabled" aria-disabled="true">ОФОРМИТЬ ЗАКАЗ</a>
      </div>
    </aside>

    <div id="productModal" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="modalTitle">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-card">
        <button class="modal-close" type="button" aria-label="Закрыть">×</button>
        <div class="modal-content" id="modalContent"></div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
